[project]
name = "brakenews"
version = "0.1.0"
description = "Vehicle-defect early warning from public NHTSA complaint and recall data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
    # Data (Phase 1)
    "duckdb>=1.1",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "httpx>=0.27",
    "tqdm>=4.66",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# Phase 2: complaint embeddings + clustering (sklearn ships HDBSCAN)
text = [
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
]
# Phase 2 + 4: Claude Haiku via Batch API, LangGraph agents
llm = [
    "anthropic>=0.40",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
]
# Phase 3: recall-risk model, anomaly detection, experiment tracking
model = [
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "mlflow>=2.14",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jupyterlab>=4",
    "ipykernel>=6",
    "matplotlib>=3.8",
]
all = ["brakenews[text,llm,model,dev]"]

[project.scripts]
brakenews = "pipeline.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
